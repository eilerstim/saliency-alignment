name: llava-hf/llava-1.5-13b-hf

dtype: bfloat16

gradient_checkpointing: true
freeze:
- vision_tower
- multi_modal_projector

unfreeze: []

# Patched into the saved tokenizer_config.json for vLLM compatibility (LLaMA
# tokenizer). Omitted for non-LLaMA models to avoid corrupting their tokenizer.
tokenizer_class: LlamaTokenizer
