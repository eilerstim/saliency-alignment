defaults:
  - data: coconut
  - dataloader
  - _self_

seed: 42

# Path to a fine-tuned checkpoint in HuggingFace format.
checkpoint: ???

# Inference dtype (bf16 fits a 7B vision-language model on a 24 GB GPU).
dtype: bfloat16

run_id: ${oc.env:SLURM_JOB_NAME,align_eval}_${oc.env:SLURM_JOB_ID,0}

hydra:
  run:
    dir: outputs/${run_id}
  sweep:
    dir: outputs/${run_id}
