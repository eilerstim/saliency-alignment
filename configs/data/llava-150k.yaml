# COCONut dataset configuration
# Extends base COCO config with COCONut-specific captions and masks
#
# Additional folder structure (extends coco.yaml):
# data/coco/
# ├── panoptic_train2017_masks/        # COCONut panoptic masks
# │   ├── 000000000009.png
# │   └── ...
# ├── panoptic_train2017_captions/     # COCONut annotated captions
# │   ├── 000000000009.txt
# │   └── ...
# └── coconut_pancap_50k.tar           # Downloaded archive

defaults:
  - coconut
  - _self_

coconut_samples: 23000  # Number of samples to use from COCONut

# Dataset configuration
dataset:
  _target_: finetune.data.llava_150k.dataset.llava_150k_instruct_dataset

# Collator configuration
collator:
  _target_: finetune.data.llava_150k.collator.make_collate_fn
  # processor will be passed at runtime via partial
  image_path: ${..train.images_dir}

eval_collator:
  _target_: finetune.data.llava_150k.collator.make_collate_fn
  # processor will be passed at runtime via partial
  image_path: ${..train.images_dir}

# Train/val splits
train:
  split: train
  name: train2014
  images_dir: ${..images_dir}/${.name}
  url: http://images.cocodataset.org/zips/train2014.zip

validation:
  split: validation
  name: val2014
  images_dir: ${..images_dir}/${.name}
  url: http://images.cocodataset.org/zips/val2014.zip
