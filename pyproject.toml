[project]
name = "saliency-alignment"
version = "0.1.0"
description = "Fine-tuning vision-language models with saliency alignment term for improved grounding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "hydra-core>=1.3.2",
    "lightning>=2.5.6",
    "peft>=0.14.0",
    "pillow>=12.0.0",
    "pycocotools>=2.0.10",
    "transformers>=4.57.1",
    "wandb>=0.23.0",
    "deepspeed>=0.17; sys_platform == 'linux'",
    "vl-saliency @ git+https://github.com/alexander-brady/vl-saliency@v2.0",
    "jaxtyping>=0.3.9",
]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.14.4",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["finetune"]


[tool.uv.sources]
vl-saliency = { git = "https://github.com/alexander-brady/vl-saliency", rev = "v2.0" }

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["eval"]

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "I", # isort
    "E", # pycodestyle (errors)
    "W", # pycodestyle (warnings)
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "C4", # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = ["E501", "F722"] # let the formatter handle wrapping, allow jaxtyping

[tool.ruff.lint.isort]
known-first-party = ["vl_saliency"]

[tool.pyrefly]
preset = "default"
tensor-shapes = true
